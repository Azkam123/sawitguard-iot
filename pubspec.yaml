name: sawitguard_iot
description: "Sistem Deteksi Intrusi Perkebunan Kelapa Sawit Berbasis IoT - SawitGuard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # === Firebase Core & Services ===
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  firebase_messaging: ^15.2.5
  cloud_functions: ^5.3.5

  # === State Management ===
  provider: ^6.1.5

  # === Audio & Haptics ===
  audioplayers: ^6.4.0
  vibration: ^2.0.0

  # === Local Notifications ===
  flutter_local_notifications: ^18.0.1

  # === Email OTP / Supabase ===
  supabase_flutter: ^2.8.3
  mailer: ^6.2.0

  # === UI & Utilities ===
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/lottie/
